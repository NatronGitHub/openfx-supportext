name: Continuous Integration

# On pushes to master, RB-* and tags, and on non-draft pull requests: one build
# per platform (Linux, Windows, then macOS), in C++17 (see build-one.yml).
# Extra variants (C++20, C++23, other openfx versions) are in extended.yml.

on:
  push:
    branches: [master, 'RB-*']
    tags: ['*']
    paths-ignore:
      - LICENSE
      - '**.md'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - LICENSE
      - '**.md'

# Cancel superseded runs (but never tag builds)
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  # Linux and Windows first; macOS (arm64 runners are scarce) only runs when they
  # pass. Merging requires Linux and Windows; macOS is informative. The macOS
  # build also runs nightly (extended.yml).
  build:
    name: ${{ matrix.name }}
    # no CI on draft pull requests
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Ubuntu 24.04 (GCC), os: ubuntu-24.04, shell: 'bash -eo pipefail {0}' }
          - { name: Windows (MSYS2 UCRT64), os: windows-2022, shell: 'msys2 {0}' }
    uses: ./.github/workflows/build-one.yml
    with:
      name: ${{ matrix.name }}
      os: ${{ matrix.os }}
      shell: ${{ matrix.shell }}

  macos:
    name: macOS 15 arm64 (Xcode clang)
    needs: [build]
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    # system (Xcode) clang; no MacPorts or Homebrew dependency is needed
    uses: ./.github/workflows/build-one.yml
    with:
      name: macOS 15 arm64 (Xcode clang)
      os: macos-15
