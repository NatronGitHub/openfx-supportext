name: Continuous Integration

# On pushes to master, RB-* and tags, and on non-draft pull requests: one build
# per platform in C++17: Linux (see build-one.yml) and Windows (an MSVC x64 compile
# check), then macOS. The Windows MSYS2 UCRT64 build is weekly (extended.yml),
# following the maintainer's Windows policy (one fast C++17 Windows build per change).
# Extra variants (C++20, C++23, other openfx versions) are in extended.yml.

on:
  push:
    branches: [master, 'RB-*']
    tags: ['*']
    paths-ignore:
      - LICENSE
      - '**.md'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - LICENSE
      - '**.md'

# Cancel superseded runs (but never tag builds)
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  # Linux and Windows first; macOS (arm64 runners are scarce) only runs when they
  # pass. Merging requires Linux and Windows (MSVC); macOS is informative. The
  # macOS and Windows MSYS2 builds also run weekly (extended.yml).
  build:
    name: ${{ matrix.name }}
    # no CI on draft pull requests
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Ubuntu 24.04 (GCC), os: ubuntu-24.04, shell: 'bash -eo pipefail {0}' }
    uses: ./.github/workflows/build-one.yml
    with:
      name: ${{ matrix.name }}
      os: ${{ matrix.os }}
      shell: ${{ matrix.shell }}

  macos:
    name: macOS 15 arm64 (Xcode clang)
    needs: [build, msvc]
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    # system (Xcode) clang; no MacPorts or Homebrew dependency is needed
    uses: ./.github/workflows/build-one.yml
    with:
      name: macOS 15 arm64 (Xcode clang)
      os: macos-15

  # The per-change Windows build: an MSVC x64 compile check (windows-2022 runners are
  # the fastest and most available Windows ones). openfx-misc's and openfx-gmic's
  # nightlies are built with MSVC; it also catches <windows.h> macro clashes such as
  # small (#92). Errors fail; warnings are printed.
  msvc:
    name: Windows (MSVC)
    # no CI on draft pull requests
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Checkout openfx-supportext
        uses: actions/checkout@v4
      - name: Checkout openfx
        uses: actions/checkout@v4
        with:
          repository: NatronGitHub/openfx
          ref: master
          path: openfx
      - name: MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
      - name: Compile
        shell: pwsh
        # the top-level CMakeLists.txt compile check (Ninja, cl from the developer
        # environment); errors fail, warnings are printed
        run: |
          cmake -S . -B "$env:RUNNER_TEMP/supportext-check" -G Ninja -DOPENFX_DIR="$PWD/openfx" `
            -DCMAKE_CXX_STANDARD=17 -DCMAKE_CXX_COMPILER=cl "-DCMAKE_CXX_FLAGS=/EHsc /W3"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build "$env:RUNNER_TEMP/supportext-check" --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
