name: Build (one platform)

# Reusable: the per-platform build used by ci.yml (per push / pull request) and
# extended.yml (nightly macOS). Compiles every SupportExt source file in C++17
# with warnings as failures, against openfx master and 2303ff8 (pre-OFX 1.5),
# then loads and renders a few SupportExt-based openfx-misc plug-ins with
# openfx's hostDemo (tests/hostdemo/run.sh). On Linux it also builds openfx-misc
# with this SupportExt.

on:
  workflow_call:
    inputs:
      name:
        required: true
        type: string
      os:
        required: true
        type: string
      shell:
        required: false
        type: string
        default: 'bash -eo pipefail {0}'

permissions:
  contents: read

jobs:
  build:
    name: ${{ inputs.name }}
    runs-on: ${{ inputs.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: ${{ inputs.shell }}
    steps:
      - name: Checkout openfx-supportext
        uses: actions/checkout@v4
      - name: Checkout openfx master
        uses: actions/checkout@v4
        with:
          repository: NatronGitHub/openfx
          ref: master
          path: openfx
      - name: Checkout openfx 2303ff8 (pre-OFX 1.5)
        uses: actions/checkout@v4
        with:
          repository: NatronGitHub/openfx
          ref: 2303ff811bee3ffe085287602f684fe5fe5357e0
          path: openfx-pre15
      - name: Install Ubuntu packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl-dev libglu1-mesa-dev libegl-dev
      - name: Setup MSYS2 UCRT64
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          cache: true
          install: git base-devel mingw-w64-ucrt-x86_64-cc mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-ninja
      - name: Compiler version
        run: |
          set -eo pipefail
          c++ --version
      - name: Compile (openfx master, C++17)
        run: |
          set -eo pipefail
          CXXSTD=-std=c++17 .github/scripts/compile.sh openfx
      - name: Compile (openfx 2303ff8, C++17)
        run: |
          set -eo pipefail
          CXXSTD=-std=c++17 .github/scripts/compile.sh openfx-pre15
      - name: CMake helper (compile check of every source, consumer tests)
        # tests/cmake: add_subdirectory(SupportExt) then a call from the parent,
        # sibling includes, a STATIC library linked into a module, OPENGL modules
        # linked without undefined symbols, options inside COMPONENTS, calls from other
        # directories with consumer-created imported targets, old (3.1) policies
        run: |
          set -eo pipefail
          cmake -S . -B "$RUNNER_TEMP/supportext-cmake" -DOPENFX_DIR="$PWD/openfx"
          cmake --build "$RUNNER_TEMP/supportext-cmake" --parallel
          cmake -S tests/cmake -B "$RUNNER_TEMP/supportext-cmake-tests" -DOPENFX_DIR="$PWD/openfx"
          cmake --build "$RUNNER_TEMP/supportext-cmake-tests" --parallel
          # calls from another directory with consumer-created imported targets
          cmake -S tests/cmake/visibility -B "$RUNNER_TEMP/supportext-cmake-visibility"
          cmake -S tests/cmake/visibility_late -B "$RUNNER_TEMP/supportext-cmake-visibility-late"
          # a consumer with cmake_minimum_required(VERSION 3.1) policies (configure
          # only): CMake 4 rejects policy versions below 3.5
          case "$(cmake --version)" in
            "cmake version "[0-3].*)
              cmake -S tests/cmake/oldpolicy -B "$RUNNER_TEMP/supportext-cmake-oldpolicy" ;;
            *)
              echo "::notice::tests/cmake/oldpolicy skipped: CMake >= 4 rejects 3.1 policies" ;;
          esac
      - name: Load and render plug-ins with hostDemo
        # builds openfx's hostDemo and a bundle of openfx-misc plug-ins (Transform,
        # Crop, Constant, Rectangle, Position) against this SupportExt, linked like
        # the consumers' bundles, and renders each one: catches link, export,
        # describe and render errors that compiling alone doesn't see
        run: |
          set -eo pipefail
          git clone --depth 1 https://github.com/NatronGitHub/openfx-misc.git "$RUNNER_TEMP/openfx-misc-src"
          CXXSTD=-std=c++17 tests/hostdemo/run.sh openfx "$RUNNER_TEMP/openfx-misc-src" "$RUNNER_TEMP/hostdemo"
      - name: Build openfx-misc with this SupportExt
        if: runner.os == 'Linux'
        run: |
          set -eo pipefail
          git clone --depth 1 --recurse-submodules --shallow-submodules https://github.com/NatronGitHub/openfx-misc.git "$RUNNER_TEMP/openfx-misc"
          rm -rf "$RUNNER_TEMP/openfx-misc/SupportExt"
          mkdir "$RUNNER_TEMP/openfx-misc/SupportExt"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/openfx-misc/SupportExt"
          make -C "$RUNNER_TEMP/openfx-misc" -j4 CONFIG=release
