name: Build (one platform)

# Reusable: the per-platform build used by ci.yml (per push / pull request: Linux,
# macOS) and extended.yml (weekly: macOS, Windows MSYS2 UCRT64). Compiles every
# SupportExt source file with CMake (the top-level CMakeLists.txt compile check) in
# C++17 with warnings as errors, against
# openfx master, runs the CMake helper tests, then (Linux, macOS) builds openfx-misc with this
# SupportExt and renders all its plug-ins with hostDemo (openfx-misc's
# smoketest.sh), then again with hostDemo as an OFX 1.4-only host (--ofx14).

on:
  workflow_call:
    inputs:
      name:
        required: true
        type: string
      os:
        required: true
        type: string
      shell:
        required: false
        type: string
        default: 'bash -eo pipefail {0}'

permissions:
  contents: read

jobs:
  build:
    name: ${{ inputs.name }}
    runs-on: ${{ inputs.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: ${{ inputs.shell }}
    steps:
      - name: Checkout openfx-supportext
        uses: actions/checkout@v4
      - name: Checkout openfx master
        uses: actions/checkout@v4
        with:
          repository: NatronGitHub/openfx
          ref: master
          path: openfx
      - name: macOS deployment target (the runner's macOS)
        # CI builds are not shipped: target the runner's macOS (e.g. 15 on macos-15); release
        # bundles target 14.0 (the CMake default when MACOSX_DEPLOYMENT_TARGET is not set)
        if: runner.os == 'macOS'
        shell: bash
        run: echo "MACOSX_DEPLOYMENT_TARGET=$(sw_vers -productVersion | cut -d. -f1).0" >> "$GITHUB_ENV"
      - name: Install Ubuntu packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl-dev libglu1-mesa-dev libegl-dev libexpat1-dev
      - name: Setup MSYS2 UCRT64
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          cache: true
          install: git base-devel mingw-w64-ucrt-x86_64-cc mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-ninja mingw-w64-ucrt-x86_64-expat
      - name: Compiler version
        run: |
          set -eo pipefail
          c++ --version
      - name: Compile (openfx master, C++17)
        # the top-level CMakeLists.txt: a compile check of every source, warnings as errors
        run: |
          set -eo pipefail
          cmake -S . -B "$RUNNER_TEMP/supportext-check" -DOPENFX_DIR="$PWD/openfx" \
            -DCMAKE_CXX_STANDARD=17 -DCMAKE_CXX_EXTENSIONS=OFF -DCMAKE_CXX_FLAGS="-Wall -Wextra -Wno-unused-parameter" -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
          cmake --build "$RUNNER_TEMP/supportext-check" --parallel
      - name: CMake helper (consumer tests)
        # tests/cmake (see its CMakeLists.txt): functional/, the helper's contracts
        # (add_subdirectory(SupportExt) then a call from the parent, components and
        # options, sibling includes, a STATIC library linked into a module, calls from
        # another directory, modules linked without undefined symbols); regression/,
        # past failures with consumer-created imported targets and old (3.1) policies
        run: |
          set -o pipefail
          # (the compile check of every source is the "Compile" step above)
          # every part runs, so that a failure reports both kinds; the step fails if any did
          fail=0
          echo "::group::functional tests (tests/cmake/functional)"
          { cmake -S tests/cmake -B "$RUNNER_TEMP/supportext-cmake-tests" -DOPENFX_DIR="$PWD/openfx" &&
            cmake --build "$RUNNER_TEMP/supportext-cmake-tests" --parallel; } || { echo "::error::functional tests failed"; fail=1; }
          echo "::endgroup::"
          # regression tests: separate projects, configured and generated only
          for t in visibility visibility_late visibility_twice; do
            echo "::group::regression test tests/cmake/regression/$t"
            cmake -S "tests/cmake/regression/$t" -B "$RUNNER_TEMP/supportext-cmake-regression-$t" ||
              { echo "::error::regression test $t failed"; fail=1; }
            echo "::endgroup::"
          done
          # a consumer with cmake_minimum_required(VERSION 3.1) policies: CMake 4
          # rejects policy versions below 3.5
          case "$(cmake --version)" in
            "cmake version "[0-3].*)
              echo "::group::regression test tests/cmake/regression/oldpolicy"
              cmake -S tests/cmake/regression/oldpolicy -B "$RUNNER_TEMP/supportext-cmake-regression-oldpolicy" ||
                { echo "::error::regression test oldpolicy failed"; fail=1; }
              echo "::endgroup::" ;;
            *)
              echo "::notice::tests/cmake/regression/oldpolicy skipped: CMake >= 4 rejects 3.1 policies" ;;
          esac
          exit "$fail"
      - name: Build openfx-misc with this SupportExt, and render all its plug-ins
        # openfx-misc's own smoke test (.github/tools/smoketest.sh --supportext):
        # builds openfx-misc with CMake (Release, hostDemo, tests) using THIS
        # SupportExt's sources instead of its submodule, then describes and renders
        # every plug-in with hostDemo; catches link, export, describe and render
        # errors that compiling alone doesn't see. Linux and macOS (the script's
        # platforms); on Windows, openfx-misc's own CI (loadtest.sh: every bundle is
        # loaded and every plug-in described) is the backstop for link and load
        # errors of SupportExt-based bundles; Windows renders are not tested. openfx-misc master is used, with
        # its pinned openfx (the openfx master checkout above is compile-checked only)
        # and its expectation lists (SKIP, XFAIL, PARAMS renders of Transform,
        # Position and CornerPin, with motion blur).
        if: runner.os != 'Windows'
        run: |
          set -eo pipefail
          git clone --depth 1 --recurse-submodules --shallow-submodules https://github.com/NatronGitHub/openfx-misc.git "$RUNNER_TEMP/openfx-misc"
          echo "openfx-misc $(git -C "$RUNNER_TEMP/openfx-misc" rev-parse HEAD), openfx $(git -C "$RUNNER_TEMP/openfx-misc/openfx" rev-parse HEAD)"
          # SMOKETEST_XPASS_OK: a SupportExt PR that fixes a bug listed as XFAIL in
          # openfx-misc (XPASS), or leaves a stale entry, is reported but doesn't fail
          SMOKETEST_XPASS_OK=1 "$RUNNER_TEMP/openfx-misc/.github/tools/smoketest.sh" --quick --supportext "$PWD" \
            --build "$RUNNER_TEMP/openfx-misc-build" "$RUNNER_TEMP/openfx-misc-install"
      - name: Render all openfx-misc plug-ins in an OFX 1.4-only host
        # The same installed bundles and hostDemo, run with --ofx14 (only the OFX 1.4 host
        # properties and suites, no OfxSetHost, no StrChoice or Bytes params, one view):
        # the plug-ins must still describe and render without the OFX 1.5 features and the
        # host extensions (openfx-misc's SKIP list and "ofx14:" XFAIL entries apply; the
        # report must say host.profile "ofx14"). The plug-ins are not rebuilt.
        if: runner.os != 'Windows'
        run: |
          set -eo pipefail
          SMOKETEST_XPASS_OK=1 "$RUNNER_TEMP/openfx-misc/.github/tools/smoketest.sh" --quick --ofx14 \
            "$RUNNER_TEMP/openfx-misc-install"
