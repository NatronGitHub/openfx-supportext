name: Extended builds

# Extra variants that are not run per push or pull request, plus the per-PR
# macOS build and the Windows MSYS2 UCRT64 build (the per-PR Windows build is MSVC):
# C++20 (RB-2.6 Qt6
# builds and RB-2.7), C++23, and the openfx version used by openfx-io (05c5a75:
# OFX 1.5 Support API, but neither OFXS_SUPPORT_HAS_DRAWCONTEXT nor interact
# cursors). Weekly on Saturday at 03:17 UTC, or on demand. Every job builds
# against a moving upstream (openfx master, and openfx-misc master for the
# smoketest) and runs every week, except the two pinned openfx 05c5a75 compile
# checks: the weekly run skips them if master is the commit the last weekly run
# tested (see the changes job).

on:
  schedule:
    - cron: '17 3 * * 6'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  # a manual run doesn't cancel a weekly run (the next one is a week later)
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

permissions:
  contents: read

jobs:
  # The pinned compile checks (openfx 05c5a75) only change when SupportExt does: the
  # weekly run skips them if master is the commit that the last weekly run that
  # succeeded or failed (not cancelled) tested. Manual runs, and a failed or
  # missing lookup, build them. Every other job builds against a moving upstream
  # and always runs.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      matrix: ${{ steps.check.outputs.matrix }}
    steps:
      - id: check
        shell: bash -eo pipefail {0}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=
          if [ "$GITHUB_EVENT_NAME" = schedule ]; then
            last=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/extended.yml/runs?event=schedule&status=completed&per_page=20" \
                     --jq '[.workflow_runs[] | select(.conclusion == "success" or .conclusion == "failure")][0].head_sha // empty' || true)
          fi
          mac='macOS 15 (Xcode clang)' linux='Ubuntu 24.04 (GCC)' pin=05c5a75dd48c8afcd7c010dc301080ac0360b2f2
          entries=()
          for std in c++20 c++23; do
            entries+=("$mac|macos-15|master|$std" "$linux|ubuntu-24.04|master|$std")
          done
          if [ -n "$last" ] && [ "$last" = "$GITHUB_SHA" ]; then
            echo "master is $last, as in the last weekly run: skipping the pinned openfx 05c5a75 compile checks."
          else
            entries+=("$mac|macos-15|$pin|c++17" "$linux|ubuntu-24.04|$pin|c++17")
          fi
          printf '%s\n' "${entries[@]}" | jq -R -s -c '[split("\n")[] | select(length > 0) | split("|")
            | {os: .[1], ofx: .[2], std: .[3],
               name: "\(.[0]) / openfx \(if .[2] == "master" then "master" else .[2][0:7] end) / C++\(.[3] | ltrimstr("c++"))"}]
            | {include: .}' | sed 's/^/matrix=/' >> "$GITHUB_OUTPUT"

  # the Windows MSYS2 UCRT64 build (the toolchain of openfx-io and openfx-arena): the
  # compile checks and the CMake consumer tests of build-one.yml (the openfx-misc smoke
  # test is Linux and macOS only), weekly (the per-PR Windows build is MSVC)
  windows-ucrt64:
    uses: ./.github/workflows/build-one.yml
    with:
      name: Windows (MSYS2 UCRT64)
      os: windows-2022
      shell: 'msys2 {0}'

  # the per-PR macOS build (also run per PR, after Linux and Windows)
  macos:
    uses: ./.github/workflows/build-one.yml
    with:
      name: macOS 15 arm64 (Xcode clang) / per-PR build
      os: macos-15

  # compile checks: against openfx master every week, against the pinned openfx 05c5a75
  # unless changes skips them (the matrix comes from the changes job)
  compile:
    name: ${{ matrix.name }}
    needs: changes
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    defaults:
      run:
        shell: bash -eo pipefail {0}
    steps:
      - name: Checkout openfx-supportext
        uses: actions/checkout@v4
      - name: Checkout openfx
        uses: actions/checkout@v4
        with:
          repository: NatronGitHub/openfx
          ref: ${{ matrix.ofx }}
          path: openfx
      - name: Install Ubuntu packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl-dev libglu1-mesa-dev libegl-dev
      - name: Compile
        # the top-level CMakeLists.txt compile check, warnings as errors
        run: |
          std='${{ matrix.std }}'
          cmake -S . -B "$RUNNER_TEMP/supportext-check" -DOPENFX_DIR="$PWD/openfx" \
            -DCMAKE_CXX_STANDARD="${std#c++}" -DCMAKE_CXX_EXTENSIONS=OFF -DCMAKE_CXX_FLAGS="-Wall -Wextra -Wno-unused-parameter" -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
          cmake --build "$RUNNER_TEMP/supportext-check" --parallel
