name: Extended builds

# Extra variants that are not run per push or pull request: C++23, and the
# openfx version used by openfx-io (05c5a75: OFX 1.5 Support API, but neither
# OFXS_SUPPORT_HAS_DRAWCONTEXT nor interact cursors). Weekly, or on demand.

on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compile:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS 15 (Xcode clang) / openfx master / C++23, os: macos-15, ofx: master, std: c++23 }
          - { name: Ubuntu 24.04 (GCC) / openfx master / C++23, os: ubuntu-24.04, ofx: master, std: c++23 }
          - { name: macOS 15 (Xcode clang) / openfx 05c5a75 / C++11, os: macos-15, ofx: 05c5a75dd48c8afcd7c010dc301080ac0360b2f2, std: c++11 }
          - { name: Ubuntu 24.04 (GCC) / openfx 05c5a75 / C++11, os: ubuntu-24.04, ofx: 05c5a75dd48c8afcd7c010dc301080ac0360b2f2, std: c++11 }
    defaults:
      run:
        shell: bash -eo pipefail {0}
    steps:
      - name: Checkout openfx-supportext
        uses: actions/checkout@v4
      - name: Checkout openfx
        uses: actions/checkout@v4
        with:
          repository: NatronGitHub/openfx
          ref: ${{ matrix.ofx }}
          path: openfx
      - name: Install Ubuntu packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl-dev libglu1-mesa-dev libegl-dev
      - name: Compile
        run: CXXSTD=-std=${{ matrix.std }} .github/scripts/compile.sh openfx
