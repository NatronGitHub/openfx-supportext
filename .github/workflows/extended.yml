name: Extended builds

# Extra variants that are not run per push or pull request, plus the per-PR
# macOS build and the Windows MSYS2 UCRT64 build (the per-PR Windows build is MSVC):
# C++20 (RB-2.6 Qt6
# builds and RB-2.7) and C++23. Weekly on Saturday at 03:17 UTC, or on demand.
# Every job builds against a moving upstream (openfx master, and openfx-misc master
# for the smoketest), so the weekly run is never skipped.

on:
  schedule:
    - cron: '17 3 * * 6'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  # a manual run doesn't cancel a weekly run (the next one is a week later)
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

permissions:
  contents: read

jobs:
  # the Windows MSYS2 UCRT64 build (the toolchain of openfx-io and openfx-arena): the
  # compile checks and the CMake consumer tests of build-one.yml (the openfx-misc smoke
  # test is Linux and macOS only), weekly (the per-PR Windows build is MSVC)
  windows-ucrt64:
    uses: ./.github/workflows/build-one.yml
    with:
      name: Windows (MSYS2 UCRT64)
      os: windows-2022
      shell: 'msys2 {0}'

  # the per-PR macOS build (also run per PR, after Linux and Windows)
  macos:
    uses: ./.github/workflows/build-one.yml
    with:
      name: macOS 15 arm64 (Xcode clang) / per-PR build
      os: macos-15

  # compile checks against openfx master in C++20 and C++23
  compile:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS 15 (Xcode clang) / openfx master / C++20, os: macos-15, std: c++20 }
          - { name: Ubuntu 24.04 (GCC) / openfx master / C++20, os: ubuntu-24.04, std: c++20 }
          - { name: macOS 15 (Xcode clang) / openfx master / C++23, os: macos-15, std: c++23 }
          - { name: Ubuntu 24.04 (GCC) / openfx master / C++23, os: ubuntu-24.04, std: c++23 }
    defaults:
      run:
        shell: bash -eo pipefail {0}
    steps:
      - name: Checkout openfx-supportext
        uses: actions/checkout@v4
      - name: Checkout openfx master
        uses: actions/checkout@v4
        with:
          repository: NatronGitHub/openfx
          ref: master
          path: openfx
      - name: macOS deployment target (the runner's macOS)
        # CI builds are not shipped: target the runner's macOS (e.g. 15 on macos-15); release
        # bundles target 14.0 (the CMake default when MACOSX_DEPLOYMENT_TARGET is not set)
        if: runner.os == 'macOS'
        shell: bash
        run: echo "MACOSX_DEPLOYMENT_TARGET=$(sw_vers -productVersion | cut -d. -f1).0" >> "$GITHUB_ENV"
      - name: Install Ubuntu packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl-dev libglu1-mesa-dev libegl-dev
      - name: Compile
        # the top-level CMakeLists.txt compile check, warnings as errors
        run: |
          std='${{ matrix.std }}'
          cmake -S . -B "$RUNNER_TEMP/supportext-check" -DOPENFX_DIR="$PWD/openfx" \
            -DCMAKE_CXX_STANDARD="${std#c++}" -DCMAKE_CXX_EXTENSIONS=OFF -DCMAKE_CXX_FLAGS="-Wall -Wextra -Wno-unused-parameter" -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
          cmake --build "$RUNNER_TEMP/supportext-check" --parallel
