name: Extended builds

# Extra variants that are not run per push or pull request, plus the per-PR
# macOS build: C++20 (RB-2.6 Qt6
# builds and RB-2.7), C++23, and the openfx version used by openfx-io (05c5a75:
# OFX 1.5 Support API, but neither OFXS_SUPPORT_HAS_DRAWCONTEXT nor interact
# cursors). Nightly (skipped if master didn't change in the last day), or on
# demand.

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Skip the scheduled run if master didn't change since the previous one
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - id: check
        shell: bash -eo pipefail {0}
        run: |
          if [ "${{ github.event_name }}" != schedule ] || [ -n "$(git log --since='25 hours ago' --format=%h -1)" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "No commits on master in the last 25 hours: skipping."
          fi

  # the Windows MSYS2 UCRT64 build (the toolchain of openfx-io and openfx-arena): the
  # same steps as the per-PR Linux build, nightly (the per-PR Windows build is MSVC)
  windows-ucrt64:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    uses: ./.github/workflows/build-one.yml
    with:
      name: Windows (MSYS2 UCRT64)
      os: windows-2022
      shell: 'msys2 {0}'

  # the per-PR macOS build (also run per PR, after Linux and Windows)
  macos:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    uses: ./.github/workflows/build-one.yml
    with:
      name: macOS 15 arm64 (Xcode clang) / per-PR build
      os: macos-15

  compile:
    name: ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS 15 (Xcode clang) / openfx master / C++20, os: macos-15, ofx: master, std: c++20 }
          - { name: Ubuntu 24.04 (GCC) / openfx master / C++20, os: ubuntu-24.04, ofx: master, std: c++20 }
          - { name: macOS 15 (Xcode clang) / openfx master / C++23, os: macos-15, ofx: master, std: c++23 }
          - { name: Ubuntu 24.04 (GCC) / openfx master / C++23, os: ubuntu-24.04, ofx: master, std: c++23 }
          - { name: macOS 15 (Xcode clang) / openfx 05c5a75 / C++17, os: macos-15, ofx: 05c5a75dd48c8afcd7c010dc301080ac0360b2f2, std: c++17 }
          - { name: Ubuntu 24.04 (GCC) / openfx 05c5a75 / C++17, os: ubuntu-24.04, ofx: 05c5a75dd48c8afcd7c010dc301080ac0360b2f2, std: c++17 }
    defaults:
      run:
        shell: bash -eo pipefail {0}
    steps:
      - name: Checkout openfx-supportext
        uses: actions/checkout@v4
      - name: Checkout openfx
        uses: actions/checkout@v4
        with:
          repository: NatronGitHub/openfx
          ref: ${{ matrix.ofx }}
          path: openfx
      - name: Install Ubuntu packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl-dev libglu1-mesa-dev libegl-dev
      - name: Compile
        # the top-level CMakeLists.txt compile check, warnings as errors
        run: |
          std='${{ matrix.std }}'
          cmake -S . -B "$RUNNER_TEMP/supportext-check" -DOPENFX_DIR="$PWD/openfx" \
            -DCMAKE_CXX_STANDARD="${std#c++}" -DCMAKE_CXX_EXTENSIONS=OFF -DCMAKE_CXX_FLAGS="-Wall -Wextra -Wno-unused-parameter" -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
          cmake --build "$RUNNER_TEMP/supportext-check" --parallel
